<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hinds TV · Radio</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/f0f5bd0ad344d8eafbaee286c82a1a4e">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="hinds {{themeClass}}" style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--text); font-family: Manrope, system-ui, -apple-system, 'Segoe UI', sans-serif;">

<header style="position: absolute; left: 96px; top: 44px; height: 68px; display: flex; align-items: baseline; gap: 16px;">
  <span style="font-size: 44px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;">21:40</span>
  <span style="font-size: 24px; font-weight: 500; color: var(--muted);">Tue 20 Oct</span>
</header>
<nav aria-label="Sections" style="position: absolute; left: 960px; top: 40px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 40px; background: var(--surface);">
  <sc-for list="{{nav}}" as="n" hint-placeholder-count="7">
    <a href="{{n.href}}" aria-current="{{n.cur}}" style="height: 56px; padding: 0 28px; display: flex; align-items: center; border-radius: 28px; background: {{n.bg}}; color: {{n.color}}; font-size: 26px; font-weight: 700; white-space: nowrap;">{{n.label}}</a>
  </sc-for>
</nav>

<section aria-label="Now playing" style="position: absolute; left: 96px; top: 160px; width: 1728px; height: 224px; display: flex; align-items: center; gap: 48px;">
  <span aria-hidden="true" style="flex: 0 0 auto; width: 224px; height: 224px; border-radius: 28px; background: var(--plate); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--text);">
    <span style="font-size: 40px; line-height: 1; font-weight: 700; letter-spacing: -0.03em;">nightline</span>
    <span style="font-size: 18px; line-height: 1; font-weight: 700; letter-spacing: 0.3em; margin-right: -0.3em; color: var(--accent);">JAZZ</span>
  </span>
  <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <span style="height: 36px; padding: 0 14px; display: flex; align-items: center; border-radius: 18px; background: var(--accent); color: var(--on-accent); font-size: 20px; font-weight: 700; letter-spacing: 0.12em;">ON AIR</span>
      <span style="font-size: 26px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums;">514</span>
    </div>
    <h1 style="margin: 0; font-size: 60px; line-height: 1.05; font-weight: 700; letter-spacing: -0.03em;">Nightline Jazz</h1>
    <div style="display: flex; align-items: center; gap: 24px;">
      <span style="font-size: 28px; font-weight: 500; color: var(--muted);">The Harbour Trio — Blue Hour</span>
      <span aria-hidden="true" style="display: flex; align-items: flex-end; gap: 6px; height: 36px;">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="18">
          <span style="width: 6px; height: {{b.h}}; border-radius: 3px; background: var(--accent); opacity: {{b.o}};"></span>
        </sc-for>
      </span>
    </div>
  </div>
  <div style="flex: 0 0 auto; display: flex; gap: 16px;">
    <button style="height: 72px; padding: 0 36px; border: 0; border-radius: 36px; background: var(--chip); font-size: 28px; font-weight: 700; cursor: pointer;">Stop</button>
    <button style="height: 72px; padding: 0 36px; border: 0; border-radius: 36px; background: var(--chip); font-size: 28px; font-weight: 700; cursor: pointer;">Screen off</button>
  </div>
</section>

<section aria-label="Stations" style="position: absolute; left: 96px; top: 452px; width: 1728px; display: flex; flex-direction: column; gap: 20px;">
  <div style="display: flex; align-items: baseline; justify-content: space-between;">
    <h2 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.01em;">Stations</h2>
    <span style="font-size: 24px; font-weight: 500; color: var(--muted);">⏪ ⏩ jump a page</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px;">
    <sc-for list="{{stations}}" as="s" hint-placeholder-count="15">
      <button onClick="{{s.pick}}" aria-label="{{s.label}}" style="height: 148px; padding: 0 22px; display: flex; align-items: center; gap: 20px; border: 0; border-radius: 22px; background: {{s.bg}}; color: {{s.fg}}; text-align: left; cursor: pointer;">
        <span aria-hidden="true" style="flex: 0 0 auto; width: 96px; height: 96px; border-radius: 18px; background: {{s.plate}}; color: var(--text); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; letter-spacing: -0.02em;">{{s.ini}}</span>
        <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
          <span style="font-size: 26px; line-height: 1.15; font-weight: 700;">{{s.name}}</span>
          <span style="font-size: 22px; font-weight: 600; color: {{s.sub}}; font-variant-numeric: tabular-nums;">{{s.meta}}</span>
        </span>
      </button>
    </sc-for>
  </div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var theme = (this.props.theme === 'light') ? 'light' : 'dark';
    var sfx = theme === 'light' ? 'Light' : '';
    var go = function (n) { return n + sfx + '.dc.html'; };
    var NAV = [['Home', 'Home'], ['Live', 'ChannelList'], ['Guide', 'Guide'], ['VOD', 'VodHome'], ['Radio', 'Radio'], ['Search', 'Search'], ['Settings', 'SettingsAppearance']];
    var nav = NAV.map(function (n) {
      var on = n[0] === 'Radio';
      return { label: n[0], href: go(n[1]), cur: on ? 'page' : 'false', bg: on ? 'var(--hairline)' : 'transparent', color: on ? 'var(--text)' : 'var(--muted)' };
    });
    var LEVELS = [0.35, 0.6, 0.85, 0.5, 0.95, 0.7, 0.4, 0.8, 0.55, 1, 0.65, 0.45, 0.75, 0.3, 0.6, 0.9, 0.5, 0.7];
    var st = this.state || {};
    var focus = st.focus != null ? st.focus : 1;
    var playing = 0;
    var names = [
      ['514', 'Nightline Jazz', 'NJ'], ['501', 'Coastal FM', 'CF'], ['502', 'City Talk', 'CT'], ['505', 'Afro Wave', 'AW'], ['507', 'Classic Hours', 'CH'],
      ['509', 'Lo-Fi Study', 'LF'], ['511', 'Gospel Light', 'GL'], ['516', 'Old Skool', 'OS'], ['518', 'World News Radio', 'WN'], ['520', 'Kids Radio', 'KR'],
      ['522', 'Highlife FM', 'HL'], ['524', 'Reggae Roots', 'RR'], ['526', 'Rock Republic', 'RK'], ['528', 'Northern Soul', 'NS'], ['530', 'Sleep Sounds', 'SS']
    ];
    var stations = names.map(function (n, i) {
      var on = i === focus;
      var isPlaying = i === playing;
      return {
        name: n[1], ini: n[2],
        meta: isPlaying ? n[0] + ' · On air' : n[0],
        label: n[0] + ' ' + n[1] + (isPlaying ? ', on air' : ''),
        bg: on ? 'var(--focus)' : 'var(--surface)',
        fg: on ? 'var(--on-focus)' : 'var(--text)',
        sub: on ? 'var(--on-focus)' : (isPlaying ? 'var(--accent)' : 'var(--muted)'),
        plate: 'var(--raised)',
        pick: function () { self.setState({ focus: i }); }
      };
    });
    return {
      themeClass: theme,
      nav: nav,
      bars: LEVELS.map(function (l) { return { h: Math.round(36 * l) + 'px', o: String(0.35 + 0.65 * l) }; }),
      stations: stations
    };
  }
}
</script>
</body>
</html>
