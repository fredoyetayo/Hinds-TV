<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hinds TV · Add to favourites</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/f0f5bd0ad344d8eafbaee286c82a1a4e">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="hinds {{themeClass}}" style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000000; color: var(--text); font-family: Manrope, system-ui, -apple-system, 'Segoe UI', sans-serif;">

<img src="/_blob/03304e5cb9b44ad6f7fe83d815010dcf" alt="" style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; display: block;">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: var(--dim);"></div>

<div role="dialog" aria-modal="true" aria-labelledby="dlg-title" style="position: absolute; left: 440px; top: 116px; width: 1040px; box-sizing: border-box; padding: 52px 56px 56px; border-radius: 28px; background: var(--surface); display: flex; flex-direction: column;">
  <div style="font-size: 22px; font-weight: 700; letter-spacing: 0.14em; color: var(--accent);">ADD TO FAVOURITES</div>
  <h1 id="dlg-title" style="margin: 10px 0 0; font-size: 48px; font-weight: 700; letter-spacing: -0.02em;"><span style="color: var(--muted); font-variant-numeric: tabular-nums;">305</span>  Wildside</h1>
  <p style="margin: 10px 0 0; font-size: 24px; font-weight: 500; color: var(--muted);">Tick every list it belongs in. Lists show at the top of your groups, and ▲▼ zaps within them.</p>

  <div style="margin-top: 28px; display: flex; flex-direction: column; gap: 6px;">
    <sc-for list="{{lists}}" as="l" hint-placeholder-count="4">
      <button onClick="{{l.toggle}}" role="checkbox" aria-checked="{{l.ariaChecked}}" style="height: 76px; padding: 0 28px 0 22px; display: flex; align-items: center; gap: 20px; border: 0; border-radius: 24px; background: {{l.bg}}; color: {{l.fg}}; font-size: 28px; font-weight: 600; text-align: left; cursor: pointer;">
        <span aria-hidden="true" style="flex: 0 0 auto; width: 36px; height: 36px; box-sizing: border-box; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: {{l.boxBg}}; border: {{l.boxBorder}}; color: {{l.tick}};">
          <sc-if value="{{l.checked}}" hint-placeholder-val="{{ false }}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          </sc-if>
        </span>
        <span style="flex: 1 1 auto;">{{l.name}}</span>
        <span style="font-size: 22px; font-weight: 600; color: {{l.sub}};">{{l.count}}</span>
      </button>
    </sc-for>
  </div>

  <div style="margin-top: 22px; display: flex; align-items: center; gap: 14px;">
    <button style="flex: 1 1 auto; height: 88px; padding: 0 26px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 2px; border: 2px solid var(--chip-line); border-radius: 24px; background: transparent; cursor: pointer; text-align: left;">
      <span style="font-size: 20px; font-weight: 700; letter-spacing: 0.06em; color: var(--muted);">New list</span>
      <span style="font-size: 26px; font-weight: 500; color: var(--faint);">e.g. Kids, Sport, News</span>
    </button>
    <button style="height: 72px; padding: 0 34px; border: 0; border-radius: 36px; background: var(--chip); font-size: 26px; font-weight: 700; cursor: pointer;">Create</button>
  </div>

  <div style="margin-top: 30px; display: flex; justify-content: flex-end;">
    <a href="{{toLive}}" style="height: 72px; padding: 0 44px; display: flex; align-items: center; border-radius: 36px; background: var(--chip); font-size: 26px; font-weight: 700;">Done</a>
  </div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var theme = (this.props.theme === 'light') ? 'light' : 'dark';
    var sfx = theme === 'light' ? 'Light' : '';
    var st = this.state || {};
    var checked = st.checked || { mine: true, docs: true };
    var focus = 1;
    var base = [
      { id: 'mine', name: '★  My Channels', n: 12 },
      { id: 'sport', name: '★  Sport', n: 8 },
      { id: 'docs', name: '★  Docs', n: 6 },
      { id: 'kids', name: '★  Kids', n: 5 }
    ];
    var lists = base.map(function (l, i) {
      var on = i === focus;
      var c = !!checked[l.id];
      return {
        name: l.name,
        count: (l.n + (c && !['mine', 'docs'].includes(l.id) ? 1 : 0) - (!c && ['mine', 'docs'].includes(l.id) ? 1 : 0)) + ' channels',
        checked: c,
        ariaChecked: c ? 'true' : 'false',
        bg: on ? 'var(--focus)' : 'var(--raised)',
        fg: on ? 'var(--on-focus)' : 'var(--text)',
        sub: on ? 'var(--on-focus)' : 'var(--muted)',
        boxBg: c ? (on ? 'var(--on-focus)' : 'var(--accent)') : 'transparent',
        boxBorder: c ? '0' : (on ? '3px solid var(--on-focus)' : '3px solid var(--chip-line)'),
        tick: on ? 'var(--focus)' : 'var(--on-accent)',
        toggle: function () {
          var next = Object.assign({}, checked);
          if (next[l.id]) { delete next[l.id]; } else { next[l.id] = true; }
          self.setState({ checked: next });
        }
      };
    });
    return {
      themeClass: theme,
      lists: lists,
      toLive: 'LiveBanner' + sfx + '.dc.html'
    };
  }
}
</script>
</body>
</html>
