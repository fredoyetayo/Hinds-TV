<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hinds TV · Watching, info banner</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/f0f5bd0ad344d8eafbaee286c82a1a4e">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="hinds {{themeClass}}" style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000000; color: var(--text); font-family: Manrope, system-ui, -apple-system, 'Segoe UI', sans-serif;">

<img src="/_blob/fd1bca32c150fd9bf6b9ddf267f09c93" alt="Live picture: a packed stadium under the mountains, players on the field" style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; display: block;">
<div aria-hidden="true" style="position: absolute; left: 0; top: 600px; width: 1920px; height: 480px; background: linear-gradient(180deg, rgb(var(--bg-rgb) / 0) 0%, rgb(var(--bg-rgb) / 0.92) 42%, rgb(var(--bg-rgb) / 1) 100%);"></div>

<section aria-label="Now watching" style="position: absolute; left: 96px; top: 756px; width: 1728px; display: flex; align-items: flex-start; gap: 48px;">
  <span aria-hidden="true" style="flex: 0 0 auto; width: 224px; height: 144px; border-radius: 16px; background: var(--plate); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--text);">
    <span style="font-size: 44px; line-height: 1; font-weight: 700; letter-spacing: -0.02em;">ARENA</span>
    <span style="font-size: 16px; line-height: 1; font-weight: 700; letter-spacing: 0.24em; margin-right: -0.24em; color: var(--muted);">SPORT 2</span>
  </span>
  <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: baseline; gap: 20px;">
      <span style="font-size: 44px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums;">102</span>
      <span style="font-size: 48px; font-weight: 700; letter-spacing: -0.02em;">Arena Sport 2</span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 18px;">
      <span style="font-size: 22px; font-weight: 700; letter-spacing: 0.14em; color: var(--accent);">NOW</span>
      <span style="font-size: 28px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums;">20:00 – 23:00</span>
      <span style="font-size: 32px; font-weight: 700;">Varsity Football · Third Quarter</span>
    </div>
    <span aria-hidden="true" style="display: block; width: 1040px; height: 6px; border-radius: 3px; background: var(--track);"><span style="display: block; width: 58%; height: 6px; border-radius: 3px; background: var(--accent);"></span></span>
    <div style="display: flex; align-items: baseline; gap: 18px;">
      <span style="font-size: 22px; font-weight: 700; letter-spacing: 0.14em; color: var(--faint);">NEXT</span>
      <span style="font-size: 28px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums;">23:00</span>
      <span style="font-size: 28px; font-weight: 600; color: var(--muted);">Post-Game Live</span>
    </div>
  </div>
  <div style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">
    <span style="font-size: 36px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;">21:40</span>
    <span style="font-size: 22px; font-weight: 600; color: var(--faint);">Tuned in 0.8 s</span>
  </div>
</section>

<div style="position: absolute; left: 96px; top: 1000px; width: 1728px; display: flex; gap: 36px; font-size: 22px; font-weight: 600; color: var(--muted);">
  <span>▲▼ change channel</span>
  <span>Select · channel list</span>
  <span>◀ recent channels</span>
  <span>☰ favourite</span>
  <span>⏪ previous</span>
  <span>⏩ audio &amp; subtitles</span>
</div>

<div style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: flex; pointer-events: none;">
  <a href="{{toList}}" aria-label="Open the channel list" style="pointer-events: auto; position: absolute; left: 0; top: 0; width: 1920px; height: 700px;"></a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var theme = (this.props.theme === 'light') ? 'light' : 'dark';
    var sfx = theme === 'light' ? 'Light' : '';
    return {
      themeClass: theme,
      toList: 'ChannelList' + sfx + '.dc.html'
    };
  }
}
</script>
</body>
</html>
