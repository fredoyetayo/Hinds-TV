<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hinds TV · VOD library</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/f0f5bd0ad344d8eafbaee286c82a1a4e">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="hinds {{themeClass}}" style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--text); font-family: Manrope, system-ui, -apple-system, 'Segoe UI', sans-serif;">

<header style="position: absolute; left: 96px; top: 44px; height: 68px; display: flex; align-items: baseline; gap: 16px;">
  <span style="font-size: 44px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;">21:40</span>
  <span style="font-size: 24px; font-weight: 500; color: var(--muted);">Tue 20 Oct</span>
</header>
<nav aria-label="Sections" style="position: absolute; left: 960px; top: 40px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 40px; background: var(--surface);">
  <sc-for list="{{nav}}" as="n" hint-placeholder-count="7">
    <a href="{{n.href}}" aria-current="{{n.cur}}" style="height: 56px; padding: 0 28px; display: flex; align-items: center; border-radius: 28px; background: {{n.bg}}; color: {{n.color}}; font-size: 26px; font-weight: 700; white-space: nowrap;">{{n.label}}</a>
  </sc-for>
</nav>

<aside aria-label="Categories" style="position: absolute; left: 72px; top: 150px; width: 504px; display: flex; flex-direction: column; gap: 4px;">
  <div style="padding: 0 24px 12px; font-size: 22px; font-weight: 700; letter-spacing: 0.14em; color: var(--faint);">CATEGORIES</div>
  <a href="{{toHome}}" style="height: 64px; padding: 0 24px; display: flex; align-items: center; border-radius: 24px; font-size: 26px; font-weight: 600;">For you</a>
  <a href="{{toHome}}" style="height: 64px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; border-radius: 24px; font-size: 26px; font-weight: 600;"><span>Continue watching</span><span style="font-size: 22px; color: var(--muted);">4</span></a>
  <a href="{{self}}" style="height: 64px; padding: 0 24px; display: flex; align-items: center; border-radius: 24px; font-size: 26px; font-weight: 600;">All VOD</a>
  <span aria-hidden="true" style="display: block; height: 2px; margin: 10px 24px; background: var(--hairline);"></span>
  <a href="{{self}}" aria-current="true" style="height: 64px; padding: 0 24px; display: flex; align-items: center; border-radius: 24px; background: var(--raised); color: var(--accent); font-size: 26px; font-weight: 700;">Films</a>
  <a href="{{self}}" style="height: 64px; padding: 0 24px; display: flex; align-items: center; border-radius: 24px; font-size: 26px; font-weight: 600;">Series</a>
  <a href="{{self}}" style="height: 64px; padding: 0 24px; display: flex; align-items: center; border-radius: 24px; font-size: 26px; font-weight: 600;">Documentary</a>
  <a href="{{self}}" style="height: 64px; padding: 0 24px; display: flex; align-items: center; border-radius: 24px; font-size: 26px; font-weight: 600;">Kids</a>
  <a href="{{self}}" style="height: 64px; padding: 0 24px; display: flex; align-items: center; border-radius: 24px; font-size: 26px; font-weight: 600;">Lessons · Year 9</a>
  <a href="{{self}}" style="height: 64px; padding: 0 24px; display: flex; align-items: center; border-radius: 24px; font-size: 26px; font-weight: 600;">Lessons · Year 11</a>
  <a href="{{self}}" style="height: 64px; padding: 0 24px; display: flex; align-items: center; border-radius: 24px; font-size: 26px; font-weight: 600;">Lessons · GCSE Maths</a>
</aside>

<section aria-label="Films" style="position: absolute; left: 628px; top: 150px; width: 1184px; height: 930px; padding: 0 12px; overflow: hidden;">
  <div style="height: 72px; display: flex; align-items: center; gap: 16px;">
    <h1 style="margin: 0; flex: 1 1 auto; font-size: 44px; font-weight: 700; letter-spacing: -0.02em;">Films</h1>
    <button style="width: 420px; height: 64px; padding: 0 24px; display: flex; align-items: center; gap: 14px; border: 0; border-radius: 32px; background: var(--surface); color: var(--faint); font-size: 24px; font-weight: 500; text-align: left; cursor: pointer;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>
      Search titles…
    </button>
    <button style="height: 64px; padding: 0 28px; border: 0; border-radius: 32px; background: var(--chip); font-size: 24px; font-weight: 700; cursor: pointer;">Newest ▾</button>
  </div>
  <div style="margin-top: 28px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 32px; row-gap: 30px;">
    <sc-for list="{{films}}" as="f" hint-placeholder-count="9">
      <a href="{{toDetails}}" aria-label="{{f.label}}" style="display: flex; flex-direction: column; gap: 12px; min-width: 0;">
        <span style="position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 20px; overflow: hidden; background: var(--raised); outline: {{f.ring}}; outline-offset: 0;">
          <img src="{{f.img}}" alt="" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; display: block;">
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px;">
          <span style="font-size: 28px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{f.title}}</span>
          <span style="font-size: 24px; font-weight: 500; color: var(--muted);">{{f.meta}}</span>
        </span>
      </a>
    </sc-for>
  </div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var theme = (this.props.theme === 'light') ? 'light' : 'dark';
    var sfx = theme === 'light' ? 'Light' : '';
    var go = function (n) { return n + sfx + '.dc.html'; };
    var NAV = [['Home', 'Home'], ['Live', 'ChannelList'], ['Guide', 'Guide'], ['VOD', 'VodHome'], ['Radio', 'Radio'], ['Search', 'Search'], ['Settings', 'SettingsAppearance']];
    var nav = NAV.map(function (n) {
      var on = n[0] === 'VOD';
      return { label: n[0], href: go(n[1]), cur: on ? 'page' : 'false', bg: on ? 'var(--hairline)' : 'transparent', color: on ? 'var(--text)' : 'var(--muted)' };
    });
    var focus = 0;
    var films = [
      ['Black Sand', 'Thriller · 2025 · 2h 08m', '/_blob/9d8c5e143d41b5b3e3aca5cd3c8f961f'],
      ['Low Tide', 'Drama · 2026 · 1h 54m', '/_blob/7eb606db91527d258905a86b086fcf37'],
      ['Saltwater', 'Drama · 2024 · 1h 41m', '/_blob/0b502d278e5b9f84c6276bd916363ac4'],
      ['The Long Road', 'Classic · 1974 · 2h 15m', '/_blob/12952017740668da418d9aa32c613466'],
      ['Night Drive', 'Thriller · 2023 · 1h 47m', '/_blob/67b2328f1a94a86c4e11cac242ccb2ad'],
      ['The Ridge', 'Adventure · 2022 · 1h 58m', '/_blob/f6919594dfc2aba7cb2ea2d0f926afd4'],
      ['Northern Lights', 'Documentary · 2025 · 1h 30m', '/_blob/ebf42aa0c39f5b9001a2a4b918a70979'],
      ['Into the Fog', 'Mystery · 2021 · 1h 49m', '/_blob/63dc4049b30a2fa298071cecd1a9d98b'],
      ['The Deep', 'Documentary · 2024 · 1h 25m', '/_blob/03304e5cb9b44ad6f7fe83d815010dcf']
    ].map(function (f, i) {
      return { title: f[0], meta: f[1], img: f[2], label: f[0] + ', ' + f[1], ring: i === focus ? '6px solid var(--focus)' : 'none' };
    });
    return {
      themeClass: theme,
      nav: nav,
      films: films,
      self: go('VodLibrary'),
      toHome: go('VodHome'),
      toDetails: go('VodDetails')
    };
  }
}
</script>
</body>
</html>
